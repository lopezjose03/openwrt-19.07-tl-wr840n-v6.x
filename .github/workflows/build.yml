name: Build OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python2 python3 python3-distutils python3-setuptools \
          rsync subversion swig time unzip wget xsltproc zlib1g-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_kmod-ipt-ipopt=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-ipopt=y" >> .config
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/targets/ramips/mt76x8/*.bin
